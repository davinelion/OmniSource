# -----------------------------------------------------------------------------
# Validation for pull requests and direct pushes.
#
# Everything here is offline and read-only, so it is safe to run on forks:
# no token, no network, no write permission. Jobs are split so the structural
# gate (fast), the unit tests (matrix) and the linters (slow, cached) run in
# parallel instead of serially.
# -----------------------------------------------------------------------------
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Catalog, feeds, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate catalog and feeds
        run: |
          set -euo pipefail
          python3 scripts/validate.py

      - name: Validate translations
        run: |
          set -euo pipefail
          node scripts/validate-translations.js

      # jq-only lint + AltStore v2 structural assertions. Offline and read-only.
      - name: Lint JSON with jq
        run: |
          set -euo pipefail
          bash scripts/validate_jq.sh

      # GitHub Pages serves the branch, so the published flat/API copies in
      # the repository root are the URLs users and installers hit. They must
      # stay byte-identical to feeds/ — this is the fast, explicit gate.
      - name: Verify published root URLs match feeds/
        run: |
          set -euo pipefail
          python3 scripts/publish_root.py --check

      # Serve the repository tree the way the branch deployment does and
      # request every page, flat feed, API document and gz twin.
      - name: Smoke-test the branch-served site
        run: |
          set -euo pipefail
          python3 scripts/smoke_test.py --root --no-build

      # Guards the invariant that feeds/ and apps/ are generated, never
      # hand-edited: a rebuild from committed state must be a no-op.
      # Date-stamped values (generatedAt, lastSync, RSS timestamps, analytics
      # history) are normalized so a PR opened on a different day still
      # passes; any real content drift fails.
      - name: Verify generated artifacts are reproducible
        run: |
          set -euo pipefail
          python3 scripts/check_reproducible.py --diff

  tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests

  lint:
    name: Lint (ruff + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The runtime is stdlib-only; ruff is the only cached dependency.
      # The cache holds downloaded wheels, so repeated runs reuse them.
      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ruff-${{ runner.os }}-0.16

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python style
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check "ruff==0.16.6"
          python3 -m ruff check src/ scripts/ tests/
          python3 -m ruff format --check src/ scripts/ tests/

      # actionlint pinned via its release binary (no docker image to pull).
      # The upstream checksums.txt escapes underscores with backslashes
      # (e.g. actionlint\_1.7.12\_linux\_amd64.tar.gz), so extract the hash
      # with awk instead of unescaping the file.
      - name: Lint workflows
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt" -o /tmp/actionlint.sha256
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          EXPECTED=$(awk '/linux/ && /amd64\.tar\.gz$/ {print $1}' /tmp/actionlint.sha256)
          test -n "$EXPECTED"
          test "$(sha256sum /tmp/actionlint.tar.gz | awk '{print $1}')" = "$EXPECTED"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
