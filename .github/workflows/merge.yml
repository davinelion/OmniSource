# -----------------------------------------------------------------------------
# Merge modular feeds into the unified feeds/apps.json.
#
# feeds/ is the single source of truth for distribution. This workflow rebuilds
# the aggregate document from per-app feeds whenever feeds/*.json changes, then
# re-validates the result. It is the safety net for direct edits and hotfixes;
# the full sync pipeline produces the same output on its own schedule.
# -----------------------------------------------------------------------------
name: Merge Feeds

on:
  pull_request:
    paths:
      - "feeds/*.json"
  push:
    branches: [main]
    paths:
      - "feeds/*.json"
  workflow_dispatch:

concurrency:
  group: merge-feeds
  cancel-in-progress: false

# Read-only by default, like sync.yml and publish.yml: only the job that commits
# opts in. This workflow also runs on `pull_request`, and a PR job has no
# legitimate use for a write token - feeds/*.json is precisely the path a
# workflow-triggered push can loop back through, so the blast radius of a
# compromised step here is the whole feed tree.
permissions: {}

jobs:
  # The check half of the trigger: a feed PR gets the same merge + validate +
  # reproducibility gate as the push path, and is told when apps.json is not
  # what merge_feeds.py produces. validate.yml validates the *committed* files,
  # so without this job nothing exercises the merge on a PR until it lands.
  check:
    name: Check merged feeds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Merge modular feeds into apps.json
        run: |
          set -euo pipefail
          python3 scripts/merge_feeds.py

      - name: Publish repository-root URLs
        run: |
          set -euo pipefail
          python3 scripts/publish_root.py

      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests

      - name: Validate merged feeds
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          bash scripts/validate_jq.sh

      # No check_reproducible.py here on purpose: validate.yml already runs that
      # gate on every PR (including this one), and repeating it would report the
      # same failure twice from two workflows. What this job adds is the
      # feeds/*.json-specific assertion below, which the repo-wide gate cannot
      # make: merge_feeds.py --check only compares merge *inputs*, and the
      # pipeline overwrites those files after the merge, so "apps.json equals
      # merge output" is verified nowhere else.
      #
      # Nothing is committed on a PR, so the rebuild's own output is the diff to
      # check: any change means the branch carries a hand-edited apps.json.
      - name: Fail when apps.json is not the merge output
        run: |
          set -euo pipefail
          paths=(feeds/apps.json apps.json api/apps.json api/apps api/apps.json.gz api/apps.gz)
          if ! git diff --quiet -- "${paths[@]}"; then
            echo "::error::apps.json (and its published copies) is not what scripts/merge_feeds.py produces from feeds/*.json on this branch."
            echo "Run: python3 scripts/merge_feeds.py && python3 scripts/publish_root.py, then commit the result."
            git status --porcelain -- "${paths[@]}"
            exit 1
          fi
          echo "apps.json matches the modular feeds."

  merge:
    name: Rebuild apps.json from feeds/
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Merge modular feeds into apps.json
        run: |
          set -euo pipefail
          python3 scripts/merge_feeds.py

      # The historical flat URL (the installable source, /apps.json) and the
      # /api/ mirror are committed copies of feeds/: GitHub Pages serves this
      # branch, so they must be refreshed whenever the master feed changes.
      - name: Publish repository-root URLs
        run: |
          set -euo pipefail
          python3 scripts/publish_root.py

      # Test gate: the commit step below only runs if every check here is
      # green (GitHub Actions skips the rest of the job on any failure).
      # Same suite validate.yml requires on PRs.
      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests

      - name: Validate merged feeds
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          bash scripts/validate_jq.sh

      # A rebuild from committed state must be a no-op: a hand-edited feed
      # drifts and fails here instead of being published to main.
      - name: Verify generated artifacts are reproducible
        run: |
          set -euo pipefail
          python3 scripts/check_reproducible.py

      - name: Commit merged apps.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/apps.json apps.json api/apps.json api/apps api/apps.json.gz api/apps.gz

          if git diff --cached --quiet; then
            echo "apps.json already matches feeds/."
            exit 0
          fi

          git commit -m "chore(feeds): merge modular feeds into apps.json [skip ci]"
          # Rebase instead of force-push: a concurrent human commit must survive.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
