# -----------------------------------------------------------------------------
# Security gate.
#
# Verifies SHA-256 / SHA-512 coverage, duplicate binaries, download
# integrity and provenance on every push/PR touching the supply chain,
# and daily on a schedule. A *critical* finding fails the job and blocks
# publication; the full report is committed as data/security.json.
# -----------------------------------------------------------------------------
name: Security

on:
  push:
    branches: [main]
    paths:
      - catalog.json
      - feeds/**
      - scripts/**
      - src/**
      - data/mirrors.json
      - .github/workflows/security.yml
  pull_request:
    paths:
      - catalog.json
      - feeds/**
      - scripts/**
      - src/**
      - data/mirrors.json
      - .github/workflows/security.yml
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Scan and gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate distribution feeds
        run: |
          set -euo pipefail
          # Our own merged feeds legitimately share bundle IDs across tweaks
          # (documented limitation), so duplicates are warnings here — while
          # every other discovery rule still fails closed.
          python3 scripts/validation/validate_feed.py feeds/apps.json --allow-duplicates
          for client in altstore sidestore feather esign livecontainer; do
            if [ -f "feeds/clients/${client}.json" ]; then
              python3 scripts/validation/validate_feed.py "feeds/clients/${client}.json" --allow-duplicates
            fi
          done

      - name: Run security scan (fails on critical findings)
        run: |
          set -euo pipefail
          python3 scripts/security/scan.py --fail-on critical

      - name: Upload security report
        uses: actions/upload-artifact@v6
        with:
          name: security-report
          path: |
            data/security.json
            security-report.json
          if-no-files-found: error
          retention-days: 30

  commit:
    name: Publish security report
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/download-artifact@v7
        with:
          name: security-report
          path: security-artifact

      - name: Commit security report
        run: |
          set -euo pipefail
          cp security-artifact/data/security.json data/security.json
          cp security-artifact/security-report.json security-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/security.json security-report.json
          if git diff --cached --quiet; then
            echo "Security report unchanged."
            exit 0
          fi
          git commit -m "chore(security): refresh security posture report [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::security report push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
