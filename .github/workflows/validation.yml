# Publication gate for discovered, quarantined, and generated metadata.
# validate.yml remains the broad repository/PR suite; this focused workflow
# gives the source lifecycle a named, independently observable gate.
name: Validation Engine

on:
  pull_request:
    paths:
      - catalog.json
      - feeds/**
      - data/quarantine/**
      - data/source_policy.json
      - scripts/validation/**
      - src/omnisource/metadata_validation.py
      - src/omnisource/remote_validation.py
      - src/omnisource/source_policy.py
      - .github/workflows/validation.yml
  push:
    branches: [main]
    paths:
      - catalog.json
      - feeds/**
      - data/quarantine/**
      - data/source_policy.json
      - scripts/validation/**
      - src/omnisource/metadata_validation.py
      - src/omnisource/remote_validation.py
      - src/omnisource/source_policy.py
      - .github/workflows/validation.yml
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validate feeds and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Recorded sourcing verdicts (data/source_policy.json) are enforced here, not
      # only inside discovery: an entry that resolves from a rejected host must fail
      # the publication gate even if it was authored straight into catalog.json.
      - name: Enforce sourcing policy
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          test -s data/source_policy.json
          python3 -m omnisource.source_policy check-catalog
          # Canary: a store this project already rejected must still be refused.
          # check-url exits 1 on a blocked URL, so "succeeded" is the failure here.
          if python3 -m omnisource.source_policy check-url https://armconverter.com/store/us >/dev/null; then
            echo "::error::the sourcing policy no longer blocks the store rejected on 2026-09-15"
            exit 1
          fi
          echo "sourcing policy: catalog clean, rejected stores still refused"

      - name: Validate feed structure
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_feed.py feeds/apps.json --allow-duplicates
          for client in altstore sidestore feather esign livecontainer; do
            test -f "feeds/clients/${client}.json"
            python3 scripts/validation/validate_feed.py "feeds/clients/${client}.json" --allow-duplicates
          done

      - name: Validate metadata contract
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_metadata.py feeds/apps.json

      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests
