# -----------------------------------------------------------------------------
# Analytics rollups.
#
# Rolls the analytics history into daily / weekly / monthly windows for
# the Statistics page and API v3. Runs daily and on demand; output is
# committed as data/analytics_rollup.json (content-stable: no empty churn).
# -----------------------------------------------------------------------------
name: Analytics

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - feeds/analytics.json
      - data/status.json

concurrency:
  group: analytics
  cancel-in-progress: false

permissions: {}

jobs:
  rollup:
    name: Build analytics windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build rollups
        run: |
          set -euo pipefail
          python3 scripts/analytics_rollup.py

      - name: Commit analytics data
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics_rollup.json
          if git diff --cached --quiet; then
            echo "Analytics unchanged."
            exit 0
          fi
          git commit -m "chore(analytics): refresh rollup windows [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
