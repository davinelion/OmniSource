# -----------------------------------------------------------------------------
# Primary pipeline: sync upstream releases, rebuild every feed, publish the site.
#
# This is the only workflow that writes to the repository. It replaces the
# previous omnisource-build-sync.yml + updatex.yml pair, which raced each other
# for apps.json on overlapping 12h/13h schedules.
# -----------------------------------------------------------------------------
name: Sync & Publish

on:
  schedule:
    # Every 6 hours. Upstream mods usually ship within a few hours of a
    # YouTube release; twice a day was consistently too slow.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - catalog.json
      - assets/**
      - scripts/**
      - src/**
      # Hand-maintained site sources live at the repository root, not in a
      # website/ dir (see docs/website.md). The published flat/API URLs are
      # refreshed into the root by the pipeline itself on every run, so they
      # need no trigger here either.
      - index.html
      - compare.html
      - compare/**
      - collections/**
      - favorites/**
      - install/**
      - analytics/**
      - search/**
      - status/**
      - discover/**
      - graph/**
      - api/v2/**
      - js/**
      - manifest.webmanifest
      - sw.js
      - .github/workflows/sync.yml
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Rebuild feeds from feeds/state.json without calling the GitHub API"
        type: boolean
        default: false
      skip_health:
        description: "Skip download-link probing"
        type: boolean
        default: false

# Never let two runs write feeds at the same time, and never cancel a run
# midway through a commit.
concurrency:
  group: sync-publish
  cancel-in-progress: false

# Read-only by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  build:
    name: Sync, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Reuse the provider HTTP response cache between runs: stdlib-only runtime,
      # metadata only (never IPA payloads). Cache writes are opaque to the build.
      - name: Cache upstream metadata
        uses: actions/cache@v5
        with:
          path: .cache/omnisource
          key: omnisource-http-${{ runner.os }}
          restore-keys: |
            omnisource-http-

      # src/omnisource is stdlib-only on purpose: no pip install, no lockfile
      # drift, no third-party code executing with a write-scoped token.
      # Scheduled runs are incremental (skip pagination when the newest asset
      # URL is unchanged). A catalog push always does a full sync.
      - name: Build feeds
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          OMNISOURCE_WEBHOOK_URL: ${{ secrets.OMNISOURCE_WEBHOOK_URL }}
          # Workflow inputs reach the shell through the environment only —
          # never interpolate ${{ }} expressions into run: scripts.
          SKIP_SYNC: ${{ inputs.skip_sync }}
          SKIP_HEALTH: ${{ inputs.skip_health }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${EVENT_NAME}" = "schedule" ]; then
            ARGS+=(--incremental)
          fi
          if [ "${SKIP_SYNC}" = "true" ]; then
            ARGS+=(--no-sync)
          fi
          if [ "${SKIP_HEALTH}" = "true" ]; then
            ARGS+=(--no-health)
          fi
          python3 scripts/omnisource.py "${ARGS[@]}"

      # Test gate: the commit step below only runs if every check here is
      # green (GitHub Actions skips the rest of the job on any failure). This
      # is the same suite validate.yml requires on PRs, so a scheduled sync or
      # a dispatch run can never publish feeds, pages or README changes that
      # would fail a pull request.
      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests

      - name: Validate output
        run: |
          set -euo pipefail
          python3 scripts/validate.py

      # jq-only lint + AltStore v2 structural assertions.
      - name: Lint JSON with jq
        run: |
          set -euo pipefail
          bash scripts/validate_jq.sh

      # A rebuild from the freshly generated state must be a no-op: proves
      # the build is deterministic and nothing was hand-edited mid-run.
      - name: Verify generated artifacts are reproducible
        run: |
          set -euo pipefail
          python3 scripts/check_reproducible.py

      - name: Commit changes
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated feeds JSON/XML, app detail pages, static comparison +
          # collection pages, monitoring reports, README blocks, and the
          # published root surface (/apps.json, api/ + gz twins, sitemap,
          # robots, homepage stats) that GitHub Pages can serve for this
          # branch. The pipeline writes nothing else, so the allowlist stays
          # minimal on purpose: a stray file here means the build misbehaved.
          git add -A -- '*.json' '*.xml' '*.gz' 'api/**' 'apps/**' 'compare/**' \
            'collections/**' 'sources/**' 'docs/index.html' 'discover/**' 'graph/**' \
            'reports/**' README.md index.html \
            'sitemap.xml' 'robots.txt' '.nojekyll'

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes."
            exit 0
          fi

          # A concurrent run may have pushed identical content first; treat an
          # empty commit as "already published" instead of failing the run.
          if ! git commit -m "chore(feeds): sync upstream releases [skip ci]"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit (a concurrent run published first)."
            exit 0
          fi
          # Rebase instead of force-push: a concurrent human commit must survive.
          # A single transient fetch/push glitch (main can be busy right after
          # a merge) must not kill a scheduled run, so each step retries a
          # few times before failing.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git pull --rebase failed after 3 attempts"
              git status --porcelain | head -50
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated feeds (debug artifact)
        uses: actions/upload-artifact@v6
        with:
          name: generated-feeds
          path: |
            feeds/*.json
            feeds/*.xml
            apps/**/index.html
            compare/**/index.html
            collections/**/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          python3 scripts/build_site.py

      # The deployable site (_site/) is published as a Pages artifact. This
      # path is used when Pages is set to *GitHub Actions*; while it is set to
      # *Deploy from a branch*, GitHub serves the repository root instead —
      # which the pipeline keeps complete (see scripts/publish_root.py).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 (unlike v3) drops dotfiles from the tarball unless this is set,
          # which would ship a Pages artifact without `_site/.nojekyll` — the
          # marker that stops Jekyll from swallowing underscore/asset paths.
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub's own managed branch deployment ("pages build and deployment")
    # deploys the same Pages site. Sharing its `pages` concurrency group stops
    # the two deploys racing — a lost race fails the run with
    # "deployment in progress" even though nothing is broken — while
    # cancel-in-progress stays off so a queued deployment is never dropped.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages only works while Pages is set to *GitHub Actions*.
      # This repository publishes from the branch (build_type "legacy"), where
      # GitHub's own "pages build and deployment" run serves the tree the
      # pipeline keeps complete — so deploying the _site/ artifact here would
      # fail the run for a configuration that works as designed. Detect the
      # mode at runtime instead of hard-coding it: switching Pages to *GitHub
      # Actions* in the repository settings is all it takes to use this path.
      - name: Detect the Pages deployment mode
        id: pages-mode
        env:
          PAGES_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pages
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${PAGES_URL}" | jq -r '.build_type // empty') || build_type=""
          echo "pages build_type: ${build_type:-unknown}"
          if [ "${build_type}" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages builds from the branch (${build_type:-unknown}); the branch deployment serves this run's tree."
          fi

      - id: deployment
        if: steps.pages-mode.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
