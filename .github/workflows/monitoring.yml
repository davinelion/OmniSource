# -----------------------------------------------------------------------------
# Health monitoring + self-healing.
#
# Every 30 minutes: probe every upstream source and download URL, refresh
# data/status.json (online / degraded / offline), run the self-healing
# planner and re-evaluate mirror readiness. Findings are committed as
# data; this job stays green unless the tooling itself breaks.
# -----------------------------------------------------------------------------
name: Monitoring

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitoring
  cancel-in-progress: false

permissions: {}

jobs:
  monitor:
    name: Probe, heal, report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe sources and downloads
        run: |
          set -euo pipefail
          python3 scripts/monitoring/report_status.py --workers 16 --timeout 12

      - name: Plan self-healing repairs
        run: |
          set -euo pipefail
          python3 scripts/selfheal.py
          python3 scripts/mirror_check.py

      - name: Commit monitoring data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/selfheal_report.json data/mirror_status.json
          if git diff --cached --quiet; then
            echo "Monitoring state unchanged."
            exit 0
          fi
          git commit -m "chore(monitoring): health + self-heal report [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::git pull --rebase failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
