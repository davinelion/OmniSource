# =============================================================================
# Build & Inject Tweak into IPA
# =============================================================================
# Modular workflow that takes a decrypted base iOS .ipa and injects one .deb
# tweak — or an ordered bundle of them — using cyan (the maintained modern
# successor to Azule / pyzule).
#
# How to run:
#   Actions → "Build & Inject Tweak" → Run workflow → provide IPA URL & Deb URL
#   (or, for a bundle, a JSON array of deb entries).
#
# Scope limits, enforced below rather than left to goodwill:
#   * every input must be HTTPS and must not come from a host recorded in
#     data/source_policy.json (account-gated "decrypted app store" frontpages,
#     cracked-package repos, aggregator IPA libraries). OmniSource publishes
#     what an upstream project releases; it does not become a repackaging
#     service for somebody else's paid app, and the artifact of this workflow is
#     deliberately a workflow artifact — never a catalog release.
#   * the patcher is manual-dispatch only. It is not scheduled, and nothing
#     promotes its output into feeds/apps.json or catalog.json.
#
# Bundles are injected one deb at a time, in the given order, and the digest of
# every deb that was actually consumed is handed back to the caller as an
# output, so a provenance record can never describe bytes that were not used.
# A published Packages digest, when the caller supplies one, is verified before
# anything is injected.
# =============================================================================

name: Build & Inject Tweak

run-name: Build Tweak (${{ inputs.tweak_name || 'Generic' }})

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: "Direct download URL for the decrypted base .ipa"
        required: true
        type: string
      tweak_deb_url:
        description: "Direct download URL for the .deb tweak to inject (leave empty when using tweak_deb_urls_json)"
        required: false
        type: string
        default: ""
      tweak_deb_urls_json:
        description: "Bundle instead of one tweak: JSON array of {label,url,version,name,sha256}"
        required: false
        type: string
        default: ""
      tweak_name:
        description: "Name of the tweak (e.g. YTLite, BHTwitter)"
        required: true
        type: string
        default: "Tweak"
      app_name:
        description: "CFBundleDisplayName for the patched app (leave empty to keep original)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "CFBundleIdentifier for the patched app (leave empty to keep original)"
        required: false
        type: string
        default: ""
  # The Tweak Factory (tweak-factory.yml) calls this workflow once per build
  # with the URLs it resolved from the registry. Inputs mirror the dispatch
  # inputs exactly; safe_name and members_json are exported so the caller can
  # find the IPA and record the exact tweak set that was injected.
  workflow_call:
    inputs:
      base_ipa_url:
        required: true
        type: string
      tweak_deb_url:
        required: false
        type: string
        default: ""
      tweak_deb_urls_json:
        required: false
        type: string
        default: ""
      tweak_name:
        required: false
        type: string
        default: "Tweak"
      app_name:
        required: false
        type: string
        default: ""
      bundle_id:
        required: false
        type: string
        default: ""
    outputs:
      safe_name:
        description: "Sanitized tweak name, also used for the uploaded artifact"
        value: ${{ jobs.build.outputs.safe_name }}
      members_json:
        description: "The tweaks actually injected, with their measured digests"
        value: ${{ jobs.build.outputs.members_json }}

permissions:
  contents: read

jobs:
  build:
    name: Inject tweaks into IPA
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      safe_name: ${{ steps.sanitize.outputs.safe_name }}
      members_json: ${{ steps.manifest.outputs.members_json }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Cyan & Dependencies
        run: |
          set -euo pipefail
          brew install ldid dpkg
          python3 -m pip install --upgrade pip
          python3 -m pip install cyan-cli

      # Workflow inputs reach the shell through the environment only — never
      # interpolate ${{ inputs.* }} into run: scripts (script injection).
      - name: Sanitize inputs
        id: sanitize
        env:
          IN_TWEAK_NAME: ${{ inputs.tweak_name }}
          IN_BASE_IPA_URL: ${{ inputs.base_ipa_url }}
          IN_TWEAK_DEB_URL: ${{ inputs.tweak_deb_url }}
          IN_TWEAK_DEB_URLS_JSON: ${{ inputs.tweak_deb_urls_json }}
        run: |
          set -euo pipefail
          case "${IN_BASE_IPA_URL}" in
            https://*) ;;
            *) echo "::error::base_ipa_url must be an https URL"; exit 1 ;;
          esac
          if [ -z "${IN_TWEAK_DEB_URL}" ] && [ -z "${IN_TWEAK_DEB_URLS_JSON}" ]; then
            echo "::error::provide tweak_deb_url or tweak_deb_urls_json"
            exit 1
          fi
          case "${IN_TWEAK_DEB_URL}" in
            ""|https://*) ;;
            *) echo "::error::tweak_deb_url must be an https URL"; exit 1 ;;
          esac
          SAFE_NAME="$(printf '%s' "${IN_TWEAK_NAME}" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-64)"
          if [ -z "${SAFE_NAME}" ]; then
            echo "::error::tweak_name is empty after sanitization"
            exit 1
          fi
          echo "safe_name=${SAFE_NAME}" >> "${GITHUB_OUTPUT}"

      # Exactly one place decides what gets injected: this step turns either
      # input shape into workspace/tweaks.tsv (label, url, expected sha256,
      # asset name, version) and every later step reads that file.
      - name: Resolve tweak list
        env:
          IN_TWEAK_NAME: ${{ inputs.tweak_name }}
          IN_TWEAK_DEB_URL: ${{ inputs.tweak_deb_url }}
          IN_TWEAK_DEB_URLS_JSON: ${{ inputs.tweak_deb_urls_json }}
        run: |
          set -euo pipefail
          mkdir -p workspace
          python3 - <<'PY'
          import json, os, re, sys

          raw = os.environ.get("IN_TWEAK_DEB_URLS_JSON", "").strip()
          single = os.environ.get("IN_TWEAK_DEB_URL", "").strip()
          if raw:
              try:
                  entries = json.loads(raw)
              except json.JSONDecodeError as error:
                  sys.exit(f"tweak_deb_urls_json is not valid JSON: {error}")
              if not isinstance(entries, list) or not entries:
                  sys.exit("tweak_deb_urls_json must be a non-empty JSON array")
          elif single:
              label = re.sub(r"[^a-z0-9-]", "-", os.environ.get("IN_TWEAK_NAME", "tweak").lower())
              entries = [{"label": label.strip("-")[:32] or "tweak", "url": single}]
          else:
              sys.exit("provide tweak_deb_url or tweak_deb_urls_json")
          if len(entries) > 8:
              sys.exit(f"a bundle injects at most 8 tweaks, got {len(entries)}")

          rows, seen = [], set()
          for item in entries:
              if not isinstance(item, dict):
                  sys.exit("every tweak entry must be an object")
              label = re.sub(r"[^a-z0-9-]", "-", str(item.get("label") or "tweak")).strip("-")[:32] or "tweak"
              if label in seen:
                  sys.exit(f"duplicate tweak label: {label}")
              seen.add(label)
              url = str(item.get("url") or "")
              if not url.startswith("https://"):
                  sys.exit(f"{label}: url must be an https URL")
              sha = str(item.get("sha256") or "")
              if sha and not re.fullmatch(r"[0-9a-f]{64}", sha):
                  sys.exit(f"{label}: sha256 must be 64 hex characters")
              rows.append("\t".join([label, url, sha, str(item.get("name") or ""), str(item.get("version") or "")]))

          with open("workspace/tweaks.tsv", "w", encoding="utf-8") as handle:
              handle.write("\n".join(rows) + "\n")
          print("::group::tweaks to inject (" + str(len(rows)) + ")")
          for row in rows:
              print("  " + row.split("\t")[0] + " <- " + row.split("\t")[1])
          print("::endgroup::")
          PY

      # Recorded sourcing verdicts apply here as well: a base IPA pulled from an
      # account-gated cracked-app storefront, or a .deb from a cracked-package
      # repository, is refused before anything is downloaded. The run prints the
      # rule id and its reason so the operator reads a decision instead of a
      # generic network failure.
      - name: Sourcing policy gate
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          urls=("${BASE_IPA_URL}")
          while IFS=$'\t' read -r label url sha name version; do
            if [ -n "${label:-}" ] && [ -n "${url:-}" ]; then
              urls+=("${url}")
            fi
          done < workspace/tweaks.tsv
          python3 -m omnisource.source_policy check-url "${urls[@]}"
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}

      - name: Download base IPA and tweaks
        run: |
          set -euo pipefail
          cd workspace
          mkdir -p debs
          echo "Downloading base IPA..."
          curl -fSL --proto '=https' --max-time 600 "${BASE_IPA_URL}" -o base.ipa
          index=0
          while IFS=$'\t' read -r label url sha name version; do
            [ -n "${label:-}" ] || continue
            index=$((index + 1))
            file="$(printf 'debs/%03d-%s.deb' "${index}" "${label}")"
            echo "Downloading tweak ${label} (${version:-unknown})..."
            curl -fSL --proto '=https' --max-time 600 "${url}" -o "${file}"
            measured="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "${file}")"
            if [ -n "${sha}" ] && [ "${sha}" != "${measured}" ]; then
              echo "::error::${label}: the .deb digest (${measured}) does not match the digest the upstream published (${sha})"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "${label}" "${url}" "${measured}" "${name}" "${version}" >> measured.tsv
          done < tweaks.tsv
          echo "Downloaded ${index} tweak(s)."
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}

      - name: Inject tweaks using Cyan
        env:
          IN_BUNDLE_ID: ${{ inputs.bundle_id }}
          IN_APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          cd workspace
          FLAGS=()
          if [ -n "${IN_BUNDLE_ID}" ]; then
            case "${IN_BUNDLE_ID}" in
              *[!A-Za-z0-9.-]*)
                echo "::error::bundle_id contains invalid characters"
                exit 1
                ;;
            esac
            FLAGS+=(-b "${IN_BUNDLE_ID}")
          fi
          if [ -n "${IN_APP_NAME}" ]; then
            FLAGS+=(-n "${IN_APP_NAME}")
          fi

          total="$(find debs -name '*.deb' -type f | wc -l | tr -d ' ')"
          if [ "${total}" -lt 1 ]; then
            echo "::error::no tweak .deb was downloaded"
            exit 1
          fi
          current=base.ipa
          index=0
          # One cyan pass per .deb, in registry order: that keeps each step
          # attributable (and reversible) instead of trusting a single call to
          # merge N payloads in an order nobody chose. Rebranding applies on
          # the last pass so the display name of the finished app is final.
          for deb in $(find debs -name '*.deb' -type f | sort); do
            index=$((index + 1))
            out="patched-${index}.ipa"
            echo "Injecting ${deb} (${index}/${total})..."
            PASS=()
            if [ "${index}" -eq "${total}" ]; then
              PASS=("${FLAGS[@]+${FLAGS[@]}}")
            fi
            cyan -i "${current}" -o "${out}" -d "${deb}" ${PASS[@]+"${PASS[@]}"}
            current="${out}"
          done
          cp "${current}" output.ipa
          ls -l output.ipa

      # The caller records what was injected, not what was requested: the
      # manifest carries the measured digest of every file cyan consumed.
      - name: Build members manifest
        id: manifest
        run: |
          set -euo pipefail
          cd workspace
          JSON="$(python3 - <<'PY'
          import json
          members = []
          with open("measured.tsv", encoding="utf-8") as handle:
              for line in handle:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) < 3 or not parts[0]:
                      continue
                  members.append(
                      {
                          "label": parts[0],
                          "url": parts[1],
                          "sha256": parts[2],
                          "name": parts[3] if len(parts) > 3 else "",
                          "version": parts[4] if len(parts) > 4 else "",
                      }
                  )
          print(json.dumps(members, sort_keys=True, separators=(",", ":")))
          PY
          )"
          if [ -z "${JSON}" ] || [ "${JSON}" = "[]" ]; then
            echo "::error::no injected-tweak manifest was produced"
            exit 1
          fi
          echo "members_json=${JSON}" >> "${GITHUB_OUTPUT}"

      - name: Upload Patched IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.sanitize.outputs.safe_name }}-Patched-IPA
          path: workspace/output.ipa
          retention-days: 14
