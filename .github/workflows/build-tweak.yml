# =============================================================================
# Build & Inject Tweak into IPA
# =============================================================================
# Modular workflow that takes a decrypted base iOS .ipa and injects any .deb
# tweak or dylibs using cyan (the maintained modern successor to Azule / pyzule).
#
# How to run:
#   Actions → "Build & Inject Tweak" → Run workflow → provide IPA URL & Deb URL.
#
# Scope limits, enforced below rather than left to goodwill:
#   * both inputs must be HTTPS and must not come from a host recorded in
#     data/source_policy.json (account-gated "decrypted app store" frontpages,
#     cracked-package repos, aggregator IPA libraries). OmniSource publishes
#     what an upstream project releases; it does not become a repackaging
#     service for somebody else's paid app, and the artifact of this workflow is
#     deliberately a workflow artifact — never a catalog release.
#   * the patcher is manual-dispatch only. It is not scheduled, and nothing
#     promotes its output into feeds/apps.json or catalog.json.
# =============================================================================

name: Build & Inject Tweak

run-name: Build Tweak (${{ inputs.tweak_name || 'Generic' }})

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: "Direct download URL for the decrypted base .ipa"
        required: true
        type: string
      tweak_deb_url:
        description: "Direct download URL for the .deb tweak to inject"
        required: true
        type: string
      tweak_name:
        description: "Name of the tweak (e.g. YTLite, BHTwitter)"
        required: true
        type: string
        default: "Tweak"
      extra_deb_urls:
        description: "Additional .deb tweaks to inject into the same IPA, one https URL per line (empty for none)"
        required: false
        type: string
        default: ""
      app_name:
        description: "CFBundleDisplayName for the patched app (leave empty to keep original)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "CFBundleIdentifier for the patched app (leave empty to keep original)"
        required: false
        type: string
        default: ""
  # The Tweak Factory (tweak-factory.yml) calls this workflow once per build
  # with the URLs it resolved from the registry. Inputs mirror the dispatch
  # inputs exactly; safe_name is exported so the caller can find the IPA.
  workflow_call:
    inputs:
      base_ipa_url:
        required: true
        type: string
      tweak_deb_url:
        required: true
        type: string
      tweak_name:
        required: false
        type: string
        default: "Tweak"
      extra_deb_urls:
        required: false
        type: string
        default: ""
      app_name:
        required: false
        type: string
        default: ""
      bundle_id:
        required: false
        type: string
        default: ""
    outputs:
      safe_name:
        description: "Sanitized tweak name, also used for the uploaded artifact"
        value: ${{ jobs.build.outputs.safe_name }}

permissions:
  contents: read

jobs:
  build:
    name: Inject tweak into IPA
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      safe_name: ${{ steps.sanitize.outputs.safe_name }}


    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Cyan & Dependencies
        run: |
          set -euo pipefail
          brew install ldid dpkg
          python3 -m pip install --upgrade pip
          python3 -m pip install cyan-cli

      # Workflow inputs reach the shell through the environment only — never
      # interpolate ${{ inputs.* }} into run: scripts (script injection).
      - name: Sanitize inputs
        id: sanitize
        env:
          IN_TWEAK_NAME: ${{ inputs.tweak_name }}
          IN_BASE_IPA_URL: ${{ inputs.base_ipa_url }}
          IN_TWEAK_DEB_URL: ${{ inputs.tweak_deb_url }}
          IN_EXTRA_DEB_URLS: ${{ inputs.extra_deb_urls }}
        run: |
          set -euo pipefail
          case "${IN_BASE_IPA_URL}" in
            https://*) ;;
            *) echo "::error::base_ipa_url must be an https URL"; exit 1 ;;
          esac
          case "${IN_TWEAK_DEB_URL}" in
            https://*) ;;
            *) echo "::error::tweak_deb_url must be an https URL"; exit 1 ;;
          esac
          # Extra tweaks are newline-separated; every non-empty line must be
          # https. `<<<` passes the value as data (no shell expansion of the
          # URLs themselves), which is what keeps this injection-safe.
          EXTRA_COUNT=0
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            EXTRA_COUNT=$((EXTRA_COUNT + 1))
            case "${line}" in
              https://*) ;;
              *) echo "::error::extra_deb_urls line ${EXTRA_COUNT} must be an https URL"; exit 1 ;;
            esac
          done <<< "${IN_EXTRA_DEB_URLS}"
          SAFE_NAME="$(printf '%s' "${IN_TWEAK_NAME}" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-64)"
          if [ -z "${SAFE_NAME}" ]; then
            echo "::error::tweak_name is empty after sanitization"
            exit 1
          fi
          echo "safe_name=${SAFE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "extra_count=${EXTRA_COUNT}" >> "${GITHUB_OUTPUT}"

      # Recorded sourcing verdicts apply here as well: a base IPA pulled from an
      # account-gated cracked-app storefront, or a .deb from a cracked-package
      # repository, is refused before anything is downloaded. The run prints the
      # rule id and its reason so the operator reads a decision instead of a
      # generic network failure.
      - name: Sourcing policy gate
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}
          TWEAK_DEB_URL: ${{ inputs.tweak_deb_url }}
          EXTRA_DEB_URLS: ${{ inputs.extra_deb_urls }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          URLS=("${BASE_IPA_URL}" "${TWEAK_DEB_URL}")
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            URLS+=("${line}")
          done <<< "${EXTRA_DEB_URLS}"
          python3 -m omnisource.source_policy check-url "${URLS[@]}"

      - name: Download Base IPA & Deb Tweak
        id: download
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}
          TWEAK_DEB_URL: ${{ inputs.tweak_deb_url }}
          EXTRA_DEB_URLS: ${{ inputs.extra_deb_urls }}
        run: |
          set -euo pipefail
          mkdir -p workspace
          echo "Downloading base IPA..."
          curl -fSL --proto '=https' --max-time 600 "${BASE_IPA_URL}" -o workspace/base.ipa
          echo "Downloading tweak .deb..."
          curl -fSL --proto '=https' --max-time 600 "${TWEAK_DEB_URL}" -o workspace/tweak-1.deb
          INDEX=1
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            INDEX=$((INDEX + 1))
            echo "Downloading extra tweak .deb (${INDEX})..."
            curl -fSL --proto '=https' --max-time 600 "${line}" -o "workspace/tweak-${INDEX}.deb"
          done <<< "${EXTRA_DEB_URLS}"
          echo "deb_count=${INDEX}" >> "${GITHUB_OUTPUT}"

      - name: Inject Tweak using Cyan
        env:
          IN_BUNDLE_ID: ${{ inputs.bundle_id }}
          IN_APP_NAME: ${{ inputs.app_name }}
          DEB_COUNT: ${{ steps.download.outputs.deb_count }}
        id: inject
        run: |
          set -euo pipefail
          cd workspace
          FLAGS=()
          if [ -n "${IN_BUNDLE_ID}" ]; then
            case "${IN_BUNDLE_ID}" in
              *[!A-Za-z0-9.-]*)
                echo "::error::bundle_id contains invalid characters"
                exit 1
                ;;
            esac
            FLAGS+=(-b "${IN_BUNDLE_ID}")
          fi
          if [ -n "${IN_APP_NAME}" ]; then
            FLAGS+=(-n "${IN_APP_NAME}")
          fi

          DEBS=()
          COUNT="${DEB_COUNT}"
          while [ "${COUNT}" -gt 0 ]; do
            DEBS+=(-d "tweak-${COUNT}.deb")
            COUNT=$((COUNT - 1))
          done

          echo "Injecting ${DEB_COUNT} tweak(s) with Cyan..."
          # ${FLAGS[@]+"..."} / ${DEBS[@]+"..."} guard empty arrays under
          # `set -u` on the macOS runner's bash 3.2 (a bare "${FLAGS[@]}"
          # would abort as unbound).
          cyan -i base.ipa -o output.ipa "${DEBS[@]+"${DEBS[@]}"}" ${FLAGS[@]+"${FLAGS[@]}"}

      - name: Upload Patched IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.sanitize.outputs.safe_name }}-Patched-IPA
          path: workspace/output.ipa
          retention-days: 14
