# Metadata-only disaster-recovery snapshots. IPA payloads, caches, and secrets
# are excluded by src/omnisource/backup.py.
name: Backup and Recovery

on:
  schedule:
    - cron: "45 1 * * *"
    - cron: "0 2 * * 0"
    - cron: "15 2 1 * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Create verified snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot catalog, feeds, data, and API
        run: |
          set -euo pipefail
          # create_backup.py's label taxonomy is daily/weekly/monthly/manual —
          # "scheduled" was never a valid choice, so argparse exited 2 and this
          # job failed on every scheduled run (no snapshots were ever taken).
          # A scheduled run's event payload names the cron that fired it,
          # while a manual dispatch has none. Read the payload from
          # GITHUB_EVENT_PATH so that no Actions expression has to be
          # interpolated into the shell (see the hardening rules in
          # .github/workflows/README.md), and quote the case patterns so the
          # cron wildcards stay literal instead of globbing.
          schedule=$(jq -r '.schedule // empty' "$GITHUB_EVENT_PATH")
          case "${schedule}" in
            '45 1 * * *') label=daily ;;
            '0 2 * * 0') label=weekly ;;
            '15 2 1 * *') label=monthly ;;
            *) label=manual ;;
          esac
          python3 scripts/backup/create_backup.py create \
            --label "${label}" \
            --destination "$RUNNER_TEMP/omnisource-backups"

      - name: Upload verified snapshot
        uses: actions/upload-artifact@v7
        with:
          name: omnisource-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/omnisource-backups
          if-no-files-found: error
          retention-days: 90
