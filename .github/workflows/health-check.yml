# -----------------------------------------------------------------------------
# Automated download-link health check.
#
# Probes every app downloadURL (and every fallbackDownloadURLs mirror) in the
# distributable feeds with HTTP HEAD requests, and files a GitHub Issue listing
# any broken links. The issue is created on first failure, appended to on
# subsequent runs, and closed automatically once every link is reachable again,
# so there is exactly one durable, linkable record to work from and it never
# outlives the outage it describes. A green run means "the checker ran and
# reported" — use the dynamic apps/downloads badges in the README for the live
# availability signal.
# -----------------------------------------------------------------------------
name: Health Check

on:
  schedule:
    # Daily, off the release-sync cadence so a transient upstream outage gets
    # caught even when no new release has shipped.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Probe download links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe download URLs and mirrors
        run: |
          set -euo pipefail
          python3 scripts/health_check.py --report-issue
        env:
          GH_TOKEN: ${{ github.token }}
