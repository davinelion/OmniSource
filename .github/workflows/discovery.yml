# -----------------------------------------------------------------------------
# Autonomous source discovery.
#
# Searches GitHub (code search), candidate feed URLs, release repositories
# and web catalogs for new AltStore / SideStore / Feather / ESign /
# LiveContainer sources every 12 hours, validates every candidate, and
# merges the survivors into data/discovered_sources.json.
#
# Discoveries are never copied directly into a client feed. Structural
# validation, remote feed verification, and the explicit publication projection
# run as separate gates; catalog changes still require a reviewed source entry.
# -----------------------------------------------------------------------------
name: Discovery

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      skip_github:
        description: "Skip the GitHub code-search pass"
        type: boolean
        default: false

concurrency:
  group: discovery
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    name: Discover and validate sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository discovery pass
        if: inputs.skip_github != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/discovery/discover_repositories.py

      - name: Run multi-forge iOS release discovery
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FORGEJO_HOSTS: ${{ vars.FORGEJO_HOSTS }}
        run: |
          set -euo pipefail
          # GitLab, Codeberg and configured Forgejo instances are searched for
          # projects that actually publish IPA/TIPA release assets. The pass
          # writes candidates only; validation/quarantine and catalog review
          # remain mandatory before publication.
          python3 scripts/discovery/discover_forges.py

      - name: Inspect FMHY and external catalog pages
        run: |
          set -euo pipefail
          python3 scripts/discovery/discover_web_catalogs.py --file data/discovery_pages.txt

      - name: Run discovery passes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_GITHUB: ${{ inputs.skip_github }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${SKIP_GITHUB}" = "true" ]; then
            ARGS+=(--skip-github)
          fi
          python3 scripts/discovery/discover_sources.py "${ARGS[@]}"

      - name: Validate discoveries (invalid sources never publish)
        run: |
          set -euo pipefail
          # Fail closed, but stay green: an invalid record is isolated in
          # data/quarantine/ and dropped from the discovery store, which the
          # commit step below persists. Failing hard here instead would skip
          # that commit, leave the bad record in the store and wedge every
          # later run. A record that cannot be isolated — or one that was
          # already verified/published — still fails the job.
          python3 scripts/validation/validate_source.py --quarantine-invalid

      - name: Verify and publish only clean feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/discovery/verify_sources.py --publish

      - name: Commit discovery and publication projections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_sources.json data/quarantine/sources.json data/published_sources.json
          if git diff --cached --quiet; then
            echo "No new discoveries."
            exit 0
          fi
          git commit -m "chore(discovery): autonomous source discovery [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::git pull --rebase failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
