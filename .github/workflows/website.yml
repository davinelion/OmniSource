# -----------------------------------------------------------------------------
# Modern website (Next.js) — typecheck, lint, build.
#
# Builds web/ (Next.js 15 + TypeScript + Tailwind PWA) on every change.
# The static zero-dependency site at the repository root keeps deploying
# through sync.yml; this workflow verifies the modern app and uploads the
# production build as an artifact. Promotion to hosting (Vercel /
# Cloudflare / Pages) is a documented manual step — see web/README.md —
# so a web/ regression can never take down the live source.
# -----------------------------------------------------------------------------
name: Website

on:
  push:
    branches: [main]
    paths:
      - web/**
      - api/v3/**
      - feeds/clients/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - web/**
      - api/v3/**
      - feeds/clients/**
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: |
          set -euo pipefail
          npm ci

      - name: Typecheck
        working-directory: web
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Lint
        working-directory: web
        run: |
          set -euo pipefail
          npm run lint

      - name: Build
        working-directory: web
        run: |
          set -euo pipefail
          npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: website-build
          path: web/.next
          retention-days: 7
