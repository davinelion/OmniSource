<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OmniSource — automated, source-first aggregation platform for iOS sideloading clients">
  <title>OmniSource</title>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1c"/>
      <stop offset="0.34" stop-color="#171039"/>
      <stop offset="0.66" stop-color="#221247"/>
      <stop offset="1" stop-color="#120c2e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.17)"/>
      <stop offset="0.42" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f1efff"/>
      <stop offset="1" stop-color="#cfc6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4dff"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b4dff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9a9ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="b1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="b3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#aurora)"/>

  <circle cx="985" cy="120" r="240" fill="#5b4dff" opacity="0.50" filter="url(#b1)"/>
  <circle cx="165" cy="520" r="270" fill="#8b5cf6" opacity="0.42" filter="url(#b1)"/>
  <circle cx="610" cy="70" r="190" fill="#f472b6" opacity="0.32" filter="url(#b2)"/>
  <circle cx="1120" cy="500" r="150" fill="#0891b2" opacity="0.28" filter="url(#b2)"/>

  <rect x="90" y="96" width="1020" height="438" rx="36" fill="url(#glass)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="92" y="98" width="1016" height="2.4" rx="1.2" fill="rgba(255,255,255,0.32)"/>
  <rect x="92" y="96" width="1016" height="438" rx="35" fill="none" stroke="rgba(40,50,90,0.16)" stroke-width="1"/>

  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#bca9ff" text-anchor="middle" letter-spacing="5">AUTOMATED · SOURCE-FIRST · VERIFIED</text>

  <text x="600" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#b39dff" opacity="0.85" text-anchor="middle" letter-spacing="-2" filter="url(#b3)">OmniSource</text>
  <text x="600" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="url(#title)" text-anchor="middle" letter-spacing="-2">OmniSource</text>

  <rect x="432" y="352" width="336" height="2" rx="1" fill="url(#hairline)"/>

  <text x="600" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="rgba(242,243,250,0.88)" text-anchor="middle">An automated, source-first aggregation platform for iOS sideloading clients.</text>

  <rect x="248.6" y="452.0" width="125.1" height="42" rx="21.0" fill="url(#chip)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="250.1" y="453.5" width="122.1" height="1.2" rx="0.6" fill="rgba(255,255,255,0.35)"/>
  <text x="311.1" y="479.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f3fa" text-anchor="middle" letter-spacing="0.2">AltStore</text>
  <rect x="387.7" y="452.0" width="135.8" height="42" rx="21.0" fill="url(#chip)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="389.2" y="453.5" width="132.8" height="1.2" rx="0.6" fill="rgba(255,255,255,0.35)"/>
  <text x="455.6" y="479.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f3fa" text-anchor="middle" letter-spacing="0.2">SideStore</text>
  <rect x="537.4" y="452.0" width="114.5" height="42" rx="21.0" fill="url(#chip)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="538.9" y="453.5" width="111.5" height="1.2" rx="0.6" fill="rgba(255,255,255,0.35)"/>
  <text x="594.7" y="479.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f3fa" text-anchor="middle" letter-spacing="0.2">Feather</text>
  <rect x="665.9" y="452.0" width="93.2" height="42" rx="21.0" fill="url(#chip)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="667.4" y="453.5" width="90.2" height="1.2" rx="0.6" fill="rgba(255,255,255,0.35)"/>
  <text x="712.5" y="479.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f3fa" text-anchor="middle" letter-spacing="0.2">ESign</text>
  <rect x="773.1" y="452.0" width="178.3" height="42" rx="21.0" fill="url(#chip)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="774.6" y="453.5" width="175.3" height="1.2" rx="0.6" fill="rgba(255,255,255,0.35)"/>
  <text x="862.3" y="479.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f3fa" text-anchor="middle" letter-spacing="0.2">LiveContainer</text>

  <circle cx="248" cy="170" r="2.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="952" cy="210" r="2.0" fill="#ffffff" opacity="0.6"/>
  <circle cx="1102" cy="138" r="1.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="250" r="1.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="1046" cy="560" r="2.2" fill="#ffffff" opacity="0.55"/>

  <rect width="1200" height="630" rx="28" fill="#ffffff" filter="url(#grain)" opacity="0.045"/>
  <rect x="0.5" y="0.5" width="1199" height="629" rx="27.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
</svg>